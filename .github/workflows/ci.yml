name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: loadmax
          POSTGRES_PASSWORD: loadmax
          POSTGRES_DB: loadmax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loadmax -d loadmax"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://loadmax:loadmax@localhost:5432/loadmax
          REDIS_URL: redis://localhost:6379/0
          ORS_API_KEY: test-key
          USE_SOLVER_MOCK: "true"
        run: >
          python -m pytest
          tests/lib
          tests/services
          tests/test_health.py
          tests/test_solver_api_unit.py
          tests/test_optimize_status_endpoint.py
          -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
