name: backend-ci

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: loadmax
          POSTGRES_PASSWORD: loadmax
          POSTGRES_DB: loadmax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loadmax -d loadmax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://loadmax:loadmax@localhost:5432/loadmax
      REDIS_URL: redis://localhost:6379/0
      ORS_API_KEY: test-key
      USE_SOLVER_MOCK: "true"
      USE_ROUTING_MOCK: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests with coverage gate
        working-directory: backend
        run: |
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-fail-under=90 \
            --cov-config=.coveragerc

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
