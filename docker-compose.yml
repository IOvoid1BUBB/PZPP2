# Dev stack: PostGIS, Redis, FastAPI API (routing via zewnętrzne OpenRouteService API).
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: loadmax
      POSTGRES_PASSWORD: loadmax
      POSTGRES_DB: loadmax
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadmax -d loadmax"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://loadmax:loadmax@db:5432/loadmax}
      ORS_API_KEY: ${ORS_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FUEL_PRICE_EUR_PER_LITER: ${FUEL_PRICE_EUR_PER_LITER:-1.75}
      DRIVER_DAILY_ALLOWANCE_EUR: ${DRIVER_DAILY_ALLOWANCE_EUR:-49.0}
      STOP_COST_MINUTES: ${STOP_COST_MINUTES:-30}
      MAX_STOPS_PER_ROUTE: ${MAX_STOPS_PER_ROUTE:-12}
      WEIGHT_FUEL_FACTOR: ${WEIGHT_FUEL_FACTOR:-0.30}
      MAINTENANCE_EUR_PER_KM: ${MAINTENANCE_EUR_PER_KM:-0.08}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
