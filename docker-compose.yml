# Dev stack: PostGIS, Redis, FastAPI API, Next.js frontend.
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: loadmax
      POSTGRES_PASSWORD: loadmax
      POSTGRES_DB: loadmax
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadmax -d loadmax"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/data:/app/data
      - ./backend/alembic:/app/alembic
      - ./backend/scripts:/app/scripts
    command:
      [
        "bash",
        "-c",
        "alembic upgrade head && python scripts/seed_vehicles.py && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://loadmax:loadmax@db:5432/loadmax}
      ORS_API_KEY: ${ORS_API_KEY}
      ORS_BASE_URL: ${ORS_BASE_URL:-https://api.openrouteservice.org}
      ORS_PROFILE: ${ORS_PROFILE:-driving-hgv}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      FUEL_PRICE_EUR_PER_LITER: ${FUEL_PRICE_EUR_PER_LITER:-1.75}
      DRIVER_DAILY_ALLOWANCE_EUR: ${DRIVER_DAILY_ALLOWANCE_EUR:-49.0}
      STOP_COST_MINUTES: ${STOP_COST_MINUTES:-30}
      MAX_STOPS_PER_ROUTE: ${MAX_STOPS_PER_ROUTE:-12}
      WEIGHT_FUEL_FACTOR: ${WEIGHT_FUEL_FACTOR:-0.30}
      MAINTENANCE_EUR_PER_KM: ${MAINTENANCE_EUR_PER_KM:-0.08}
      # Fast/deterministic solver + routing for E2E + CI.
      USE_SOLVER_MOCK: ${USE_SOLVER_MOCK:-false}
      USE_ROUTING_MOCK: ${USE_ROUTING_MOCK:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://api:8000}
        NEXT_PUBLIC_API_BASE: ""
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://api:8000
      NEXT_PUBLIC_API_BASE: ""
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/planner').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
