[project]
name = "loadmax-backend"
version = "0.1.0"
description = "LoadMax backend – FastAPI consolidation / VRP planner."
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC",
]
ignore = [
    "B008",    # function call in default args (FastAPI Depends)
    "N818",    # AppException name is part of the public spec, not "*Error"
    "RUF002",  # allow en-dashes in docstrings
    "UP017",   # keep explicit timezone.utc (datetime.UTC available only from 3.11+)
    "UP043",   # keep explicit AsyncGenerator[..., None] for readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"alembic/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "app.schemas.*"
strict = true

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "redis.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
